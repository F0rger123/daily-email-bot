<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="DAILY EMAIL BOT: Your commits, summarized at 7 AM and 7 PM. Free forever.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070b"/><stop offset="1" stop-color="#11121c"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f43f5e" stop-opacity="0"/><stop offset=".5" stop-color="#f43f5e" stop-opacity=".9"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#f43f5e" stop-opacity=".42"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#fb923c" stop-opacity=".34"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace}
    .spin{animation:spin linear infinite}.rev{animation-direction:reverse}
    .orb{animation:drift 16s ease-in-out infinite alternate}.orb2{animation:drift2 20s ease-in-out infinite alternate}
    .scan{animation:scan 7s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes drift{to{transform:translate(140px,40px)}}
    @keyframes drift2{to{transform:translate(-160px,-30px)}}
    @keyframes scan{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle class="orb" cx="260" cy="40" r="300" fill="url(#ga)"/>
    <circle class="orb2" cx="1050" cy="320" r="320" fill="url(#gb)"/>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:28s"><polygon points="1085.0,100.0 1181.0,196.0 1085.0,292.0 989.0,196.0" fill="none" stroke="url(#acc)" stroke-width="2" stroke-opacity="0.9"/></g>
    <g class="spin rev" style="transform-origin:1085px 196px;animation-duration:38s"><polygon points="1109.0,130.2 1150.8,220.0 1061.0,261.8 1019.2,172.0" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.68"/></g>
    <g class="spin" style="transform-origin:1085px 196px;animation-duration:48s"><polygon points="1113.3,162.3 1118.7,224.3 1056.7,229.7 1051.3,167.7" fill="none" stroke="url(#acc)" stroke-width="1.25" stroke-opacity="0.46"/></g>
    <circle cx="1085" cy="196" r="5" fill="#f43f5e"/>
    <text x="64" y="70" class="mono" font-size="14" letter-spacing="3" fill="#f43f5e">◆ F0RGER123 / daily-email-bot</text>
    <text x="1216" y="70" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#9a9aa8">PUBLIC · MIT</text>
    <text x="64" y="174.56" class="sans" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#ttl)">DAILY EMAIL BOT</text>
    <text x="64" y="216.56" class="mono" font-size="19" fill="#c9c9d6">Your commits, summarized at 7 AM and 7 PM. Free forever.<tspan class="blink" fill="#f43f5e"> ▍</tspan></text>
    <g transform="translate(64,262)"><rect width="88" height="30" rx="15" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-opacity=".45"/><text x="44" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Node.js</text></g>
    <g transform="translate(162,262)"><rect width="148" height="30" rx="15" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-opacity=".45"/><text x="74" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">GitHub Actions</text></g>
    <g transform="translate(320,262)"><rect width="114" height="30" rx="15" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-opacity=".45"/><text x="57" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">OpenRouter</text></g>
    <g transform="translate(444,262)"><rect width="114" height="30" rx="15" fill="#f43f5e" fill-opacity=".08" stroke="#f43f5e" stroke-opacity=".45"/><text x="57" y="20" text-anchor="middle" class="mono" font-size="13" fill="#e7e7ee">Gmail SMTP</text></g>
    <text x="1216" y="306" text-anchor="end" class="mono" font-size="12" letter-spacing="3" fill="#6e6e7c">DEB-0700</text>
    <rect class="scan" x="0" y="337" width="420" height="3" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="339" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
